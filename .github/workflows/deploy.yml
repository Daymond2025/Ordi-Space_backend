name: CI/CD Backend – ordisapce.daymondboutique.com

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: # permet de relancer un déploiement manuellement depuis GitHub

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # CI — tourne sur chaque push ET chaque pull request, jamais sauté.
  # Le déploiement ne se lance que si ce job réussit (cf. `needs: tests`).
  # ─────────────────────────────────────────────────────────────────────────
  tests:
    name: Tests
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: true
          MYSQL_DATABASE: ordispace_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql, tokenizer, xml, ctype, json
          coverage: none

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run migrations
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ordispace_test
          DB_USERNAME: root
          DB_PASSWORD:
        run: php artisan migrate --force

      - name: Run test suite
        env:
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: ordispace_test
          DB_USERNAME: root
          DB_PASSWORD:
        run: php artisan test

  # ─────────────────────────────────────────────────────────────────────────
  # CD — uniquement sur push master, et seulement si les tests sont verts.
  # Hébergement mutualisé Infomaniak sans accès SSH ni exec()/shell_exec() :
  # composer install tourne ici en CI (vendor/ est envoyé tel quel par FTP),
  # puis deploy-hook.php (dans public/, accessible via /public/deploy-hook.php
  # car la racine web pointe sur la racine du dépôt) exécute migrate/seed/
  # caches directement en PHP via le Console Kernel de Laravel — jamais par
  # un appel shell, puisque exec() est indisponible sur ce serveur.
  # ─────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy via FTP + Hook
    runs-on: ubuntu-latest
    needs: tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo, pdo_mysql, tokenizer, xml, ctype, json

      - name: Install Composer dependencies
        # --no-scripts : évite de lancer "php artisan package:discover" en CI
        # (pas de .env, pas de BDD disponible). exec()/shell_exec() étant
        # désactivés sur l'hébergement mutualisé, composer ne peut pas tourner
        # côté serveur — vendor/ construit ici est donc envoyé tel quel par
        # FTP (cf. exclude ci-dessous, vendor/ n'y est plus listé).
        run: composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Deploy files via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          security: loose
          timeout: 120000
          local-dir: ./
          server-dir: /sites/ordisapce.daymondboutique.com/
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            **/tests/**
            **/.github/**
            .env
            .env.*
            storage/logs/**
            !storage/logs/.gitignore
            storage/framework/cache/**
            !storage/framework/cache/.gitignore
            !storage/framework/cache/data/.gitignore
            storage/framework/sessions/**
            !storage/framework/sessions/.gitignore
            storage/framework/testing/**
            !storage/framework/testing/.gitignore
            storage/framework/views/**
            !storage/framework/views/.gitignore
            storage/app/public/**
            !storage/app/public/.gitignore
            public/storage/**

      - name: Trigger post-deploy hook
        # La racine web du domaine pointe sur la racine du dépôt (pas sur
        # public/) — deploy-hook.php n'est donc atteignable qu'via /public/.
        run: |
          RESPONSE=$(curl -s "https://ordisapce.daymondboutique.com/public/deploy-hook.php?token=${{ secrets.DEPLOY_TOKEN }}")
          echo "$RESPONSE"
          echo "$RESPONSE" | jq '.' 2>/dev/null || true
          echo "$RESPONSE" | jq -e '.success == true' >/dev/null || (echo "::error::Le deploy-hook a échoué" && exit 1)
